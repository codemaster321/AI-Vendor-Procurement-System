# Render Blueprint for the backend API (the frontend is hosted on Vercel).
# In Render: New → Blueprint → pick this repo. Secrets marked `sync: false`
# are asked for during setup and are never stored in the repo.
services:
  - type: web
    name: rfp-manager-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FRONTEND_URL
        value: https://rfp-manager-vert.vercel.app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
